<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>말모이 탐정 사무소 1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    :root{
      /* 색상 위계 */
      --primary-dark:#1b5e20;
      --primary:#2e7d32;
      --indigo:#689f38;
      --sage:#33691e;
      --paper:#f1f8e9;
      --ink:#1a2a1e;
      --muted:#556b5a;
      --line:#c5e1a5;
      --tab:#f9a825;
      --hint:#fff9c4;
      --danger:#e53935;
      --shadow:0 8px 24px rgba(27,94,32,0.13);
      --radius:20px;
      /* 반응형 타이포그래피 */
      --fs-xs:  clamp(14px, 1.8vw, 18px);
      --fs-sm:  clamp(16px, 2.1vw, 21px);
      --fs-md:  clamp(18px, 2.4vw, 24px);
      --fs-lg:  clamp(20px, 2.8vw, 28px);
      --fs-xl:  clamp(24px, 3.5vw, 36px);
      --fs-2xl: clamp(28px, 4.2vw, 44px);
      /* 반응형 레이아웃 */
      --btn-h:  clamp(46px, 5.5vw, 66px);
      --pad:    clamp(12px, 2vw,   24px);
    }
    /* ── 반응형 CSS 변수 (폰 기본값) ── */
    :root{
      --paper:#f1f8e9; --ink:#1a2a1e; --muted:#556b5a;
      --line:#c5e1a5; --tab:#f9a825;
      --primary-dark:#1b5e20; --primary:#2e7d32; --indigo:#689f38;
      --sage:#33691e; --hint:#fff9c4; --danger:#e53935;
      --shadow:0 8px 24px rgba(27,94,32,0.13); --radius:20px;
      /* 폰트 크기 */
      
      /* 버튼·패딩 */
      --btn-h:64px; --pad:18px;
    }
    @media(min-width:768px){ :root{ --pad:clamp(16px,2.2vw,28px); } }
    @media(max-width:420px){ :root{ --pad:clamp(10px,3vw,16px); } }

    /* ── 기본 리셋 ── */
    *{font-family:'Jua',system-ui,-apple-system,sans-serif !important;
      box-sizing:border-box;}
    html,body{
      width:100%;margin:0;padding:0;
      color:var(--ink);font-size:var(--fs-md);
      -webkit-text-size-adjust:100%;
      background:var(--bg);
    }
    /* 앱 컨테이너: 최대너비 960px, 세로 전체 */
    .app-container{
      display:flex;flex-direction:column;
      height:100dvh;width:100%;
      overflow:hidden;
      box-sizing:border-box;
    }

    /* ── TOPBAR ── */
    .topbar{
      width:100%;flex-shrink:0; padding:clamp(8px,1.2vw,16px) var(--pad);
      background:rgba(241,248,233,.97); backdrop-filter:blur(10px);
      z-index:10; border-bottom:1px solid rgba(197,225,165,.4);
    }
    .bar{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border:1px solid var(--line); border-radius:22px; padding:16px 18px;
      background:linear-gradient(180deg,#fff,#f9fbe7);
      box-shadow:0 6px 20px rgba(46,74,51,.06);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:140px;}
    .book{
      width:52px;height:52px;border-radius:16px; flex-shrink:0;
      background:linear-gradient(135deg,var(--indigo),#33691e);
      color:#fff;display:flex;align-items:center;justify-content:center;
      box-shadow:0 6px 16px rgba(104,159,56,.3); font-size:22px;
    }
    .titleWrap{line-height:1.2;}
    .title{font-size:clamp(30px,4.3vw,44px) !important;letter-spacing:-.2px;}
    .tagline{display:none!important;}

    /* XP Section */
    .xp-section{display:flex;flex-direction:column;gap:3px;min-width:120px;flex:1;max-width:200px;}
    .xp-top{display:none;}
    .level-label{display:none;}
    .xp-amt{display:none;}
    .xp-bar-row{display:none;}
    .xp-bar{display:none;}
    
    .xp-next{display:none;}

    .tabs{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:visible;}
    .chip{
      display:inline-flex;align-items:center;gap:5px;
      padding:0 12px;height:40px;border-radius:12px;
      font-size:clamp(25px,2.2vw,28px) !important;
      border:1px solid var(--line);background:#fff;
      font-size:clamp(18px,2.9vw,32px) !important !important;color:var(--ink);
      box-shadow:0 3px 8px rgba(46,74,51,.06); white-space:nowrap;
    }
    .chip b{color:var(--indigo);}
    /* ── 버튼 위계 ──────────────────────────────────────────── */
    .btn{
      height:40px; border-radius:12px; border:2px solid var(--line);
      background:#fff; padding:0 14px; cursor:pointer;
      transition:transform .12s, box-shadow .12s, background .12s;
      user-select:none; font-size:clamp(25px,2.2vw,28px) !important;
      font-family:'Jua',sans-serif; color:var(--ink); white-space:nowrap;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(27,94,32,.13);}
    .btn:active{transform:translateY(1px);}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:grayscale(1);}

    /* 1순위: 채워진 진한 녹색 — 화면당 1개만 */
    /* CTA */ .btn.cta{
      background:var(--primary-dark);color:#fff;
      border-color:var(--primary-dark);
      font-size:clamp(21px,3.3vw,35px) !important;
    }
    .btn.cta:hover{background:var(--primary);transform:translateY(-2px);}
    .btn.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #145214;}

    /* 2순위: 아웃라인 녹색 — 보조 액션 */
    .btn.secondary{
      background:#fff; color:var(--primary);
      border-color:var(--primary); border-width:2.5px;
      font-weight:bold;
    }
    .btn.secondary:hover{background:rgba(46,125,50,.06);}

    /* 3순위: 텍스트만 — 최소 강조 */
    .btn.ghost{
      background:transparent; border-color:transparent;
      color:var(--muted);
    }
    .btn.ghost:hover{background:rgba(0,0,0,.04);}

    /* 앰버 — 보상/뱃지 계열 */
    .btn.amber{
      background:#fff8e1;color:#e65100;
      border-color:#ffb300;
    }

    /* 기존 별칭 유지 (호환) */
    .btn.primary{background:rgba(104,159,56,.1);color:var(--indigo);border-color:var(--indigo);}
    .btn.tab{background:#fff8e1;color:#e65100;border-color:#ffb300;}
    .btn.good{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark);box-shadow:0 4px 0 #145214;}
    .btn.good:active{transform:translateY(3px);box-shadow:0 1px 0 #145214;}
    .btn.warn{background:#fff;color:var(--danger);border-color:var(--danger);}
    .btn.big{height:calc(var(--btn-h) + 8px);font-size:var(--fs-lg) !important;border-radius:18px;padding:0 28px;}

    /* ── ROOT / CARD ── */
    /* #root: 반응형 CSS로 이동 */
    .card{
      width:100%;flex:1;min-height:0;
      border:1px solid var(--line);border-radius:var(--radius);
      background:linear-gradient(180deg,#fff,#f1f8e9);
      box-shadow:var(--shadow);padding:clamp(10px,1.8vw,22px);
      position:relative;display:flex;flex-direction:column;
      justify-content:flex-start;overflow-y:auto;
    }
    .card::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(0deg,transparent,rgba(200,230,201,.2));
      pointer-events:none;opacity:.45;
    }
    .card>*{position:relative;z-index:1;flex-shrink:0;}

    /* ── LOGIN 새 디자인 ── */
    .login-wrap{
      display:flex;flex-direction:column;align-items:center;
      gap:12px;padding:clamp(8px,1.2vw,16px) var(--pad);text-align:center;
      width:100%;
    }

    /* 번호 디스플레이 바 — 하나의 넓은 박스 */
    .num-display{
      width:100%;max-width:340px;margin:0 auto;padding:18px 20px;border-radius:18px;
      border:2px solid #e0e0e0;background:#f8f8f8;
      font-size:clamp(38px,5vw,48px) !important;letter-spacing:16px;
      color:#bbb;text-align:center;
      box-shadow:inset 0 2px 6px rgba(0,0,0,.06);
      min-height:72px;display:flex;align-items:center;justify-content:center;
      transition:border-color .2s,color .2s,background .2s;
      font-weight:bold;box-sizing:border-box;
    }
    .num-display.has-input{
      color:var(--primary-dark);border-color:var(--indigo);
      background:#fff;letter-spacing:14px;
    }

    /* 오류/검색 */
    .student-not-found{
      font-size:var(--fs-sm) !important;color:var(--danger);
      background:#ffebee;border:1px solid rgba(239,83,80,.3);
      border-radius:12px;padding:9px 18px;animation:shake .3s ease;width:100%;
    }
    .student-searching{
      font-size:var(--fs-sm) !important;color:var(--muted);animation:pulse 1s infinite;
    }

    /* 숫자 패드 */
    .numpad{
      display:grid;grid-template-columns:repeat(3,1fr);
      gap:10px;width:100%;max-width:360px;
    }
    .numpad-btn{
      height:68px;border-radius:16px;
      border:2px solid #e0e0e0;background:#fff;
      font-family:'Jua',sans-serif;font-size:clamp(34px,4vw,42px) !important;
      color:#222;cursor:pointer;
      box-shadow:0 4px 0 #c8c8c8;
      transition:all .1s;user-select:none;
      display:flex;align-items:center;justify-content:center;
    }
    .numpad-btn:hover{background:#f5f5f5;}
    .numpad-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c8c8c8;}
    .numpad-btn.del{
      background:#fff5ed;border-color:#ffc8a0;color:#d06020;font-size:clamp(22px,3.4vw,36px) !important;
      box-shadow:0 4px 0 #f0b080;
    }
    .numpad-btn.del:active{transform:translateY(3px);box-shadow:0 1px 0 #f0b080;}
    .numpad-btn.ok{
      background:linear-gradient(135deg,#c5cae9,#9fa8da);
      border-color:#7986cb;color:#fff;
      font-size:clamp(20px,3.1vw,34px) !important;font-weight:bold;
      box-shadow:0 4px 0 #5c6bc0;
    }
    .numpad-btn.ok:hover{background:linear-gradient(135deg,#9fa8da,#7986cb);}
    .numpad-btn.ok:active{transform:translateY(3px);box-shadow:0 1px 0 #5c6bc0;}
    .numpad-btn.ok:disabled{
      background:#e0e0e0;border-color:#ccc;color:#aaa;
      box-shadow:none;cursor:not-allowed;transform:none;
    }

    /* 번호 안내 */
    .num-guide{font-size:var(--fs-sm) !important;color:var(--muted);line-height:1.9;}
    .num-guide b{color:var(--primary-dark);}

    /* fallback 텍스트 입력 */
    .login-input{
      width:100%;padding:14px 18px;border-radius:16px;
      border:2px solid var(--line);background:#fff;
      font-family:'Jua',sans-serif;font-size:clamp(24px,3.6vw,38px) !important;color:var(--ink);
      outline:none;text-align:center;
      box-shadow:0 4px 12px rgba(0,0,0,.06);transition:border-color .2s;
    }
    .login-input:focus{border-color:var(--indigo);}

    /* ── TYPOGRAPHY ── */
    .h1{margin:0 0 10px;font-size:clamp(36px,4vw,46px);letter-spacing:-.5px;color:var(--sage);}
    .lead{margin:0 0 12px;color:var(--muted);line-height:1.5;font-size:var(--fs-md);}

    /* ── MASCOT ── */
    .mascot-area{
      display:flex;gap:10px;align-items:center;margin-bottom:6px;
      background:rgba(255,255,255,.7);padding:10px;border-radius:16px;
      border:1px solid var(--line);cursor:pointer;transition:transform .2s;
    }
    .mascot-area:active{transform:scale(.98);}
    .mascot{font-size:clamp(38px,5.2vw,52px) !important;animation:bounce 2s infinite;}
    .mascot-text{font-size:clamp(19px,3.0vw,33px) !important;color:var(--ink);line-height:1.4;}

    /* ── GRID / LAYOUT ── */
    .grid{display:grid;grid-template-columns:1fr;gap:10px;}
    @media(min-width:860px){.grid.two{grid-template-columns:1fr 1fr;}}
    .sectionTitle{margin:0 0 8px;font-size:var(--fs-lg);display:flex;align-items:center;gap:5px;color:var(--sage);}
    .pillRow{display:flex;flex-wrap:nowrap;gap:7px;}
    .pick{
      flex:1;min-height:52px;padding:7px 4px;border-radius:14px;
      border:1px solid var(--line);background:#fff;cursor:pointer;
      box-shadow:0 3px 8px rgba(46,74,51,.06);transition:all .2s;
      font-family:'Jua',sans-serif;font-size:clamp(20px,3.1vw,34px) !important;color:var(--muted);
    }
    .pick:hover{transform:scale(1.02);}
    .pick.on{border-color:var(--indigo);background:linear-gradient(135deg,rgba(104,159,56,.15),rgba(104,159,56,.05));color:var(--indigo);}
    .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:12px 0;}
    .note{border-radius:16px;border:1px dashed var(--indigo);background:rgba(104,159,56,.08);padding:14px;color:var(--ink);line-height:1.65;font-size:clamp(19px,3.0vw,33px) !important;}

    /* ── MENU ── */
    .menu-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px;flex:1;align-content:center;}
    @media(min-width:600px){.menu-grid{grid-template-columns:1fr 1fr;}}
    .menu-card{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:22px;border-radius:22px;background:#fff;border:2px solid var(--line);
      box-shadow:0 8px 20px rgba(46,74,51,.08);cursor:pointer;transition:all .2s;text-align:center;
    }
    .menu-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(46,74,51,.15);border-color:var(--indigo);}
    .menu-card.primary{background:linear-gradient(135deg,#fff,#f1f8e9);}
    .menu-card.accent{background:linear-gradient(135deg,#fff,#fffde7);}
    .menu-icon{font-size:clamp(44px,5.9vw,58px) !important;margin-bottom:6px;}
    .menu-title{font-size:clamp(23px,3.5vw,37px) !important;font-weight:bold;color:var(--ink);margin-bottom:5px;}
    .menu-desc{font-size:var(--fs-sm) !important;color:var(--muted);}

    /* ── CONCEPT CARDS ── */
    .concept-card{background:#fff;border-radius:16px;padding:14px;border:2px solid var(--line);margin-bottom:10px;box-shadow:0 4px 10px rgba(0,0,0,.04);}
    .concept-title{font-size:clamp(24px,3.6vw,38px) !important;color:var(--sage);margin-bottom:5px;display:flex;align-items:center;gap:7px;}
    .concept-desc{font-size:clamp(20px,3.1vw,34px) !important;color:var(--ink);line-height:1.6;}

    /* ── QUIZ ── */
/* ── 낱말 의미 관계 배너 4종 ── */
    .syn-banner{background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff;border:3px solid #1b5e20;padding:14px 16px;border-radius:16px;text-align:center;font-weight:bold;font-size:clamp(28px,4vw,42px) !important;margin-bottom:10px;box-shadow:0 4px 0 rgba(27,94,32,.35);word-break:keep-all;line-height:1.25;}
    .ant-banner{background:linear-gradient(135deg,#fb8c00,#e65100);color:#fff;border:3px solid #bf360c;padding:14px 16px;border-radius:16px;text-align:center;font-weight:bold;font-size:clamp(28px,4vw,42px) !important;margin-bottom:10px;box-shadow:0 4px 0 rgba(191,54,12,.35);word-break:keep-all;line-height:1.25;}
    .inc-banner{background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;border:3px solid #0d47a1;padding:14px 16px;border-radius:16px;text-align:center;font-weight:bold;font-size:clamp(28px,4vw,42px) !important;margin-bottom:10px;box-shadow:0 4px 0 rgba(13,71,161,.35);word-break:keep-all;line-height:1.25;}
    .incl-banner{background:linear-gradient(135deg,#8e24aa,#6a1b9a);color:#fff;border:3px solid #4a148c;padding:14px 16px;border-radius:16px;text-align:center;font-weight:bold;font-size:clamp(28px,4vw,42px) !important;margin-bottom:10px;box-shadow:0 4px 0 rgba(74,20,140,.35);word-break:keep-all;line-height:1.25;}
    .quiz-question{font-size:clamp(26px,3.8vw,40px) !important;text-align:center;margin:8px 0 14px;line-height:1.5;background:#fff;padding:18px;border-radius:18px;border:3px solid var(--line);box-shadow:0 4px 0 rgba(197,225,165,.6);}
    .quiz-word{color:var(--indigo);font-size:clamp(46px,6.5vw,64px) !important;font-weight:bold;display:block;margin-top:8px;}

    /* combo display */
    .combo-display{text-align:center;min-height:28px;margin-bottom:5px;}
    .combo-badge{
      display:inline-flex;align-items:center;gap:4px;
      background:linear-gradient(135deg,#ff6f00,#ffa000);
      color:#fff;padding:7px 20px;border-radius:20px;font-size:clamp(22px,3.4vw,36px) !important;
      animation:pop .3s ease;box-shadow:0 4px 12px rgba(255,111,0,.3);
    }

    .lock-indicator{text-align:center;color:var(--muted);font-size:clamp(20px,3.1vw,34px) !important;margin-bottom:7px;animation:pulse 1s infinite;font-weight:bold;min-height:20px;}
    @keyframes pulse{0%{opacity:.6;}50%{opacity:1;}100%{opacity:.6;}}

    .choiceGrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;}

    .choiceBtn{
      min-height:clamp(50px,6vw,72px);padding:12px 6px;border-radius:18px;
      border:2px solid var(--line);background:#fff;cursor:pointer;
      box-shadow:0 4px 0 rgba(197,225,165,1);text-align:center;
      font-size:clamp(18px,2.2vw,27px) !important;color:var(--ink);font-family:'Jua',sans-serif;
      transition:all .1s;display:flex;align-items:center;justify-content:center;
      width:100%;white-space:nowrap;overflow:hidden;letter-spacing:-0.02em;
    }
    .choiceBtn:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(197,225,165,1);}
    .choiceBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(197,225,165,1);}
    .choiceBtn:disabled{cursor:not-allowed;transform:none;box-shadow:none;opacity:.6;}
    .choiceBtn.locked{opacity:.5;cursor:wait;transform:none!important;box-shadow:none!important;filter:grayscale(.5);}
    .choiceBtn.correct{background:#e8f5e9;border-color:var(--sage);color:var(--sage);box-shadow:0 6px 0 var(--sage);opacity:1;}
    .choiceBtn.wrong{background:#ffebee;border-color:var(--danger);color:var(--danger);box-shadow:none;opacity:.6;animation:shake .3s;}

    .feedback-box{margin-top:12px;padding:12px;border-radius:14px;text-align:center;animation:pop .3s ease;display:none;}
    .feedback-box.show{display:block;}
    .feedback-box.correct{background:#e8f5e9;border:2px solid var(--sage);color:var(--sage);}
    .feedback-box.wrong{background:#ffebee;border:2px solid var(--danger);color:#c62828;}
    /* ── 뜻 카드 탭 방식 ── */
    .meaning-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
    .meaning-card{
      border-radius:14px;border:2px solid var(--line);
      background:#fff;overflow:hidden;cursor:pointer;
      transition:all .2s;box-shadow:0 4px 0 rgba(197,225,165,.7);
    }
    .meaning-card:hover{border-color:var(--indigo);transform:translateY(-2px);}
    .meaning-card.opened{border-color:var(--indigo);background:linear-gradient(135deg,#f1f8e9,#fff);box-shadow:0 4px 0 var(--indigo);}
    .meaning-card-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 14px;font-size:clamp(20px,3.1vw,34px) !important;
    }
    .meaning-card-word{color:var(--indigo);font-weight:bold;}
    .meaning-card-arrow{font-size:clamp(18px,2.9vw,32px) !important;color:var(--muted);transition:transform .3s;}
    .meaning-card.opened .meaning-card-arrow{transform:rotate(180deg);color:var(--indigo);}
    .meaning-card-body{
      max-height:0;overflow:hidden;
      transition:max-height .35s ease, padding .3s;
      padding:0 14px;font-size:clamp(18px,2.9vw,32px) !important;color:var(--ink);line-height:1.5;
    }
    .meaning-card.opened .meaning-card-body{max-height:120px;padding:0 14px 12px;}
    .read-hint{
      text-align:center;font-size:clamp(19px,3.0vw,33px) !important;color:var(--muted);
      margin-top:4px;animation:pulse 1.2s infinite;
    }
    /* 기존 호환 */
    .meaning-box{display:none;}
    .meaning-item{margin-bottom:3px;}
    .meaning-item:last-child{margin-bottom:0;}
    .meaning-word{font-weight:bold;color:var(--indigo);margin-right:3px;}

    /* ── RESULT ── */
    .result-stat{background:#fff;border-radius:16px;padding:14px;border:2px solid var(--line);text-align:center;}
    .result-stat-label{font-size:var(--fs-sm) !important;color:var(--muted);margin-bottom:4px;}
    .result-stat-value{font-size:clamp(36px,4vw,44px) !important;font-weight:bold;color:var(--indigo);}
    .xp-gained-banner{
      background:linear-gradient(135deg,#fff9c4,#f1f8e9);border:2px solid var(--tab);
      border-radius:16px;padding:12px;text-align:center;margin:10px 0;animation:pop .4s ease;
    }
    .xp-gained-big{font-size:clamp(42px,5vw,54px) !important;color:#f57f17;font-weight:bold;}
    .xp-gained-label{font-size:clamp(18px,2.9vw,32px) !important;color:var(--muted);}

    /* ── BADGES ── */
    .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    @media(min-width:400px){.badge-grid{grid-template-columns:repeat(4,1fr);}}
    .badge-item{
      display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:10px 6px;border-radius:14px;border:1px solid var(--line);
      background:#fff;text-align:center;transition:transform .2s;
    }
    .badge-item.earned{background:linear-gradient(135deg,#fff9c4,#f1f8e9);border-color:var(--indigo);box-shadow:0 3px 8px rgba(104,159,56,.15);}
    .badge-item.locked{opacity:.3;filter:grayscale(.8);}
    .badge-item.new-badge{animation:pop .5s cubic-bezier(.175,.885,.32,1.275);border-color:#fbc02d;}
    .badge-icon{font-size:clamp(32px,4.5vw,46px) !important;}
    .badge-name{font-size:var(--fs-sm) !important;font-weight:bold;color:var(--ink);}
    .badge-desc{font-size:clamp(18px,2.9vw,32px) !important;color:var(--muted);line-height:1.4;}

    /* ── XP POPUP ── */
    .xp-popup-el{
      position:fixed;z-index:90;font-family:'Jua',sans-serif;
      font-size:clamp(26px,3.8vw,40px) !important;font-weight:bold;color:#e65100;
      background:linear-gradient(135deg,#fff3e0,#ffcc02);
      padding:7px 16px;border-radius:18px;
      box-shadow:0 6px 18px rgba(0,0,0,.15);pointer-events:none;
      animation:xpFloat 1.8s ease forwards;
    }
    @keyframes xpFloat{
      0%{opacity:0;transform:translateX(-50%) translateY(0) scale(.8);}
      15%{opacity:1;transform:translateX(-50%) translateY(-10px) scale(1.1);}
      70%{opacity:1;transform:translateX(-50%) translateY(-28px) scale(1);}
      100%{opacity:0;transform:translateX(-50%) translateY(-55px) scale(.9);}
    }

    /* ── LEVEL UP OVERLAY ── */
    .levelup-overlay{
      position:fixed;inset:0;z-index:95;
      background:rgba(46,74,51,.72);
      display:flex;align-items:center;justify-content:center;
      animation:pop .3s ease;
    }
    .levelup-card{
      background:linear-gradient(135deg,#fff,#f1f8e9);border:3px solid var(--indigo);
      border-radius:26px;padding:30px 22px;text-align:center;
      max-width:310px;width:90%;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
      animation:pop .4s cubic-bezier(.175,.885,.32,1.275);
    }
    .levelup-icon{font-size:60px;animation:bounce .8s infinite;display:block;margin-bottom:6px;}
    .levelup-sub{font-size:clamp(19px,3.0vw,33px) !important;color:var(--muted);margin-bottom:3px;}
    .levelup-name{font-size:clamp(34px,4vw,40px) !important;color:var(--indigo);margin-bottom:14px;}

    /* ── FOOTER ── */
    /* footerNav 제거됨 */



    /* ── ANIMATIONS ── */
    @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
    @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(251,140,0,.5);}50%{box-shadow:0 0 0 10px rgba(251,140,0,0);}}
    @keyframes pulseGlowRed{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.5);}50%{box-shadow:0 0 0 10px rgba(211,47,47,0);}}
    @keyframes conceptFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
    @keyframes arrowSlide{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}
    @keyframes pop{0%{transform:scale(.9);opacity:0;}100%{transform:scale(1);opacity:1;}}
    @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

    #confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;}

    /* ── MODAL ── */
    .backdrop{position:fixed;inset:0;background:rgba(46,74,51,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
    .modal{
      width:min(1400px,96vw);max-height:92vh;overflow-y:auto;
      border-radius:22px;border:1px solid var(--line);
      background:linear-gradient(180deg,#fff,#f1f8e9);
      box-shadow:0 30px 70px rgba(0,0,0,.18);padding:22px;animation:pop .3s ease;
    }
    .modal.wide-modal{
      width:min(98vw,2400px) !important;
      max-width:none !important;
      max-height:min(85vh,800px);
      overflow-y:auto;
    }
    .modal h3{margin:0 0 10px;font-size:var(--fs-xl) !important;color:var(--sage);}
    .modal .body{color:var(--ink);line-height:1.65;font-size:var(--fs-md) !important;}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;}

    .toast{
      position:fixed;left:50%;top:8%;transform:translateX(-50%);
      z-index:80;
      padding:clamp(12px,1.8vw,18px) clamp(16px,2.5vw,28px);
      border-radius:20px;border:2px solid var(--line);
      background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15);
      display:none;max-width:92%;line-height:1.4;
      animation:pop .3s ease;text-align:center;
      font-size:clamp(15px,2vw,22px)!important;
      font-weight:bold;letter-spacing:-.2px;
    }
    .toast.good{border-color:#43a047;color:#1b5e20;background:#f1f8e9;}
    .toast.hint{border-color:#1976d2;color:#0d47a1;background:#e3f2fd;}
    .toast.warn{border-color:#f57f17;color:#e65100;background:#fff8e1;}

    .tab-nav{display:flex;gap:8px;margin-bottom:6px;border-bottom:2px solid var(--line);padding-bottom:5px;overflow-x:auto;}
    .tab-btn{background:none;border:none;font-family:'Jua',sans-serif;font-size:clamp(27px,2.5vw,30px) !important;color:var(--muted);cursor:pointer;padding:4px 9px;white-space:nowrap;}
    .tab-btn.active{color:var(--indigo);border-bottom:3px solid var(--indigo);}
    .tab-content{display:none;}
    .tab-content.active{display:block;animation:pop .2s ease;}

    /* small screen tweaks */
    @media(max-height:680px){
      .card{padding:10px;justify-content:flex-start;}
      .h1{font-size:20px;}
      .mascot-area{padding:8px;margin-bottom:8px;}
      .menu-card{padding:12px;}
      .menu-icon{font-size:26px;margin-bottom:5px;}
      .menu-title{font-size:15px;}
      .menu-desc{font-size:clamp(16px,2.7vw,30px) !important;}
      .quiz-question{padding:10px;font-size:16px;}
      .quiz-word{font-size:22px;}
      .choiceBtn{min-height:44px;font-size:15px;padding:10px 3px;white-space:nowrap;}
    }

    /* ── 난이도 선택 ── */
    .lv-row{display:flex;gap:8px;flex-wrap:nowrap;}
    .lv-pick{
      flex:1;min-height:58px;border-radius:14px;border:2px solid var(--line);
      background:#fff;cursor:pointer;font-family:'Jua',sans-serif;
      font-size:clamp(17px,2.8vw,31px) !important;color:var(--muted);text-align:center;
      padding:5px 3px;line-height:1.3;transition:all .2s;
      box-shadow:0 3px 6px rgba(46,74,51,.06);
    }
    .lv-pick .lv-num{font-size:clamp(24px,3.6vw,38px) !important;display:block;}
    /* 단계별 색상 */
    .lv-pick.lv-stage1{border-color:#81c784;color:#2e7d32;}
    .lv-pick.lv-stage1.on{background:#2e7d32;border-color:#2e7d32;color:#fff;box-shadow:0 3px 0 #1b5e20;}
    .lv-pick.lv-stage2{border-color:#4db6ac;color:#00695c;}
    .lv-pick.lv-stage2.on{background:#00897b;border-color:#00897b;color:#fff;box-shadow:0 3px 0 #004d40;}
    .lv-pick.lv-stage3{border-color:#64b5f6;color:#1565c0;}
    .lv-pick.lv-stage3.on{background:#1976d2;border-color:#1976d2;color:#fff;box-shadow:0 3px 0 #0d47a1;}
    .lv-pick.lv-all{border-color:#ce93d8;color:#6a1b9a;}
    .lv-pick.lv-all.on{background:#7b1fa2;border-color:#7b1fa2;color:#fff;box-shadow:0 3px 0 #1b5e20;}
    .pick-count{border-color:#ffb74d;color:#e65100;}
    .pick-count.on{background:#f57c00;border-color:#f57c00;color:#fff;box-shadow:0 3px 0 #bf360c;}
    .pick-time{border-color:#90caf9;color:#1565c0;}
    .pick-time.on{background:#1976d2;border-color:#1976d2;color:#fff;box-shadow:0 3px 0 #0d47a1;}
    .section-lv{color:#2e7d32;}
    .section-count{color:#e65100;}
    .section-time{color:#1565c0;}
    .lv-pick.on{border-color:var(--indigo);background:linear-gradient(135deg,rgba(104,159,56,.18),rgba(104,159,56,.05));color:var(--indigo);}

    /* ── 학습 목표 오버레이 ── */
    .goal-overlay{
      position:fixed;inset:0;z-index:95;
      background:rgba(46,74,51,.72);
      display:flex;align-items:center;justify-content:center;
      animation:pop .3s ease;
    }
    .goal-card{
      background:linear-gradient(135deg,#fff,#f1f8e9);border:3px solid var(--indigo);
      border-radius:26px;padding:28px 22px;text-align:center;
      max-width:360px;width:92%;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
      animation:pop .4s cubic-bezier(.175,.885,.32,1.275);
    }
    .goal-title{font-size:clamp(26px,3.8vw,40px) !important;color:var(--sage);margin-bottom:10px;}
    .goal-body{font-size:clamp(16px,2.4vw,26px) !important;color:var(--ink);line-height:1.5;margin-bottom:6px;text-align:center;}
    .goal-tip{
      background:rgba(255,235,59,.25);border:1px dashed #fbc02d;
      border-radius:12px;padding:8px;font-size:clamp(14px,2vw,22px) !important;
      color:#f57f17;margin-bottom:6px;text-align:center;
    }

    /* ── 워밍업 (훈련소) ── */
    .warmup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
    .warmup-card{
      background:#fff;border:2px solid var(--line);border-radius:16px;
      padding:14px;text-align:center;
    }
    .warmup-q{font-size:clamp(28px,3.5vw,40px) !important;color:var(--ink);margin-bottom:10px;}
    .warmup-word{font-size:clamp(26px,3.8vw,40px) !important;color:var(--indigo);font-weight:bold;}
    .warmup-choices{display:flex;flex-direction:row;gap:7px;margin-top:4px;flex-wrap:nowrap;}
    .warmup-btn{
      flex:1;padding:18px 6px;border-radius:16px;border:3px solid var(--line);
      background:#fff;font-family:'Jua',sans-serif;font-size:clamp(20px,2.6vw,34px) !important;
      cursor:pointer;transition:all .15s;text-align:center;
      white-space:nowrap;overflow:hidden;letter-spacing:-0.02em;
    }
    .warmup-btn:hover{border-color:var(--indigo);}
    .warmup-btn.w-correct{background:#e8f5e9;border-color:var(--sage);color:var(--sage);}
    .warmup-btn.w-wrong{background:#ffebee;border-color:var(--danger);color:var(--danger);opacity:.6;}
    .warmup-result{font-size:clamp(24px,3vw,32px) !important;margin-top:6px;min-height:24px;}

    /* ── 힌트 먼저 보기 버튼 ── */
    .proactive-hint-btn{
      width:100%;padding:10px;border-radius:13px;border:2px dashed #fbc02d;
      background:#fffde7;font-family:'Jua',sans-serif;font-size:clamp(19px,3.0vw,33px) !important;
      color:#f57f17;cursor:pointer;margin-bottom:10px;transition:all .2s;
    }
    .proactive-hint-btn:hover{background:#fff9c4;}
    .proactive-hint-btn:disabled{opacity:.4;cursor:not-allowed;}
    .proactive-hint-box{
      background:#fff9c4;border:1px solid #fbc02d;border-radius:12px;
      padding:10px 12px;font-size:clamp(19px,3.0vw,33px) !important;color:#e65100;
      margin-bottom:10px;display:none;animation:pop .3s ease;
    }

    /* ── 전략 팁 (뜻 카드 하단) ── */
    .strategy-tip{
      background:rgba(104,159,56,.08);border:1px dashed var(--indigo);
      border-radius:11px;padding:9px 12px;
      font-size:clamp(19px,3.0vw,33px) !important;color:var(--sage);margin-top:10px;
      line-height:1.5;
    }

    /* ── 피드포워드 (결과 화면) ── */
    .feedforward-section{
      background:#fff;border:2px solid var(--line);border-radius:18px;
      padding:16px;margin-top:4px;
    }
    .feedforward-title{font-size:clamp(22px,3.4vw,36px) !important;color:var(--sage);margin-bottom:10px;}
    .wrong-word-list{display:flex;flex-direction:column;gap:7px;}
    .wrong-word-item{
      display:flex;align-items:center;gap:8px;
      background:#fff9f9;border:1px solid rgba(239,83,80,.2);
      border-radius:11px;padding:9px 12px;font-size:clamp(17px,2.8vw,31px) !important;
    }
    .wrong-word-item .ww-word{color:var(--indigo);font-weight:bold;min-width:70px;}
    .wrong-word-item .ww-arrow{color:var(--muted);}
    .wrong-word-item .ww-correct{color:var(--sage);}
    .all-correct-banner{
      text-align:center;padding:16px;
      background:linear-gradient(135deg,#f1f8e9,#fff9c4);
      border-radius:14px;border:2px solid var(--indigo);
      font-size:clamp(20px,3.1vw,34px) !important;color:var(--sage);
    }

    /* ── 결과 화면: 사건 보고서 ── */
    .result-wrap{ display:flex;flex-direction:column;gap:10px; }

    /* 🦉 말모 말풍선 */
    .result-owl{
      display:flex;align-items:center;gap:12px;
      background:linear-gradient(135deg,#f1f8e9,#fff);
      border:1.5px solid var(--line);border-radius:18px;
      padding:10px 14px;
    }
    .result-owl .owl{ font-size:clamp(40px,5.2vw,56px);animation:bounce 2.5s infinite;flex-shrink:0;line-height:1; }
    .result-owl .speech{
      background:#fff;border:1.5px solid var(--line);border-radius:14px;
      padding:9px 14px;position:relative;flex:1;
    }
    .result-owl .speech::before{
      content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
      width:0;height:0;border:9px solid transparent;border-right-color:var(--line);
    }
    .result-owl .speech::after{
      content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
      width:0;height:0;border:8px solid transparent;border-right-color:#fff;
    }
    .result-owl .name{ font-size:clamp(13px,1.6vw,16px)!important;color:var(--muted);margin-bottom:3px;letter-spacing:.5px; }
    .result-owl .msg{ font-size:clamp(17px,2.4vw,22px)!important;color:var(--primary-dark);font-weight:bold;line-height:1.35; }

    /* 🔖 사건 라벨 */
    .result-case-strip{
      align-self:center;border-radius:999px;padding:7px 22px;
      font-size:clamp(16px,2.1vw,20px)!important;font-weight:bold;
      box-shadow:0 2px 8px rgba(0,0,0,.07);
      display:inline-flex;align-items:center;gap:8px;
    }

    /* 🏅 수사 인장 (HERO) */
    .result-hero{ display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 4px; }
    .result-stamp{
      position:relative;width:clamp(150px,22vw,200px);height:clamp(150px,22vw,200px);
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      transform:rotate(-5deg);animation:stampIn .55s cubic-bezier(.175,.885,.32,1.4) both;
    }
    @keyframes stampIn{
      0%{transform:scale(2.3) rotate(25deg);opacity:0;}
      55%{transform:scale(.82) rotate(-9deg);opacity:1;}
      100%{transform:scale(1) rotate(-5deg);opacity:1;}
    }
    .result-stamp::before{
      content:"";position:absolute;inset:0;border-radius:50%;
      border:5px solid currentColor;opacity:.92;
    }
    .result-stamp::after{
      content:"";position:absolute;inset:10px;border-radius:50%;
      border:2px solid currentColor;opacity:.55;
    }
    .result-stamp.fail::after{ border-style:dashed; }
    .result-stamp .inner{ display:flex;flex-direction:column;align-items:center;line-height:1; }
    .result-stamp .score{ font-size:clamp(48px,6.5vw,64px)!important;font-weight:bold;letter-spacing:-1px; }
    .result-stamp .lb{ font-size:clamp(14px,1.7vw,17px)!important;letter-spacing:3px;margin-top:6px;opacity:.85;font-weight:bold; }

    .result-hero-title{ font-size:clamp(22px,2.9vw,28px)!important;font-weight:bold;color:var(--primary-dark);text-align:center;margin-top:2px; }
    .result-hero-msg{ font-size:clamp(17px,2.2vw,22px)!important;color:var(--muted);text-align:center;margin:0 auto;line-height:1.4; }

    /* 🎖️ 미션 뱃지 리빌 */
    .result-mission{
      background:linear-gradient(135deg,#fff,#f9fbe7);
      border-radius:16px;padding:16px 14px;position:relative;overflow:hidden;
      text-align:center;animation:pop .45s cubic-bezier(.175,.885,.32,1.275) .15s both;
    }
    .result-mission-icon{ font-size:clamp(46px,6vw,60px);line-height:1;margin-bottom:6px;display:inline-block; }
    .result-mission-name{ font-size:clamp(20px,2.7vw,26px)!important;font-weight:bold;letter-spacing:-.3px; }
    .result-mission-hint{ font-size:clamp(18px,2.2vw,22px)!important;color:var(--muted);margin-top:4px; }
    .result-new-ribbon{
      position:absolute;top:12px;right:-32px;
      background:linear-gradient(135deg,#ff6f00,#e65100);color:#fff;
      font-size:12px!important;font-weight:bold;letter-spacing:1.5px;
      padding:4px 36px;transform:rotate(32deg);
      box-shadow:0 3px 8px rgba(0,0,0,.22);
    }

    /* 💪 재도전 카드 */
    .result-retry{
      background:linear-gradient(135deg,#fff8e1,#fff3e0);
      border:2px solid #ffb74d;border-radius:16px;padding:14px;text-align:center;
    }
    .result-retry .ic{ font-size:clamp(40px,5.4vw,52px);margin-bottom:4px;line-height:1; }
    .result-retry .tt{ font-size:clamp(19px,2.6vw,24px)!important;font-weight:bold;color:#e65100; }
    .result-retry .ms{ font-size:clamp(18px,2.2vw,22px)!important;color:#6d4c00;margin-top:6px;line-height:1.5; }

    /* 📊 통계 로우 */
    .result-stats{ display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px; }
    .result-stat{
      background:#f1f8e9;border:1.5px solid var(--line);border-radius:12px;
      padding:8px 6px;text-align:center;
    }
    .result-stat .ic{ font-size:clamp(19px,2.5vw,24px);line-height:1; }
    .result-stat .val{ font-size:clamp(19px,2.6vw,25px)!important;font-weight:bold;color:var(--primary-dark);line-height:1.1;margin-top:3px; }
    .result-stat .lb{ font-size:clamp(13px,1.6vw,16px)!important;color:var(--muted);margin-top:2px; }
    .result-stat.warn{ background:#fff3e0;border-color:#ffb74d; }
    .result-stat.warn .val{ color:#e65100; }

    /* 🎉 탐정 승급 배너 (레벨업 시에만 표시) */
    .result-levelup{
      background:linear-gradient(135deg,#fffde7,#fff9c4);
      border:2.5px solid #f9a825;border-radius:16px;

// ================================================================
//  연결 상태 자동 판별 — detectConnection()
//  ① URL 해시 #c=<exec> 로 접속 → 학생 링크: execUrl 설정, ⚙️ 숨김
//  ② localStorage에 저장된 주소 → 연동: execUrl 설정, ⚙️ 보임
//  ③ 둘 다 없음 → 데모(단, google.script.run도 없을 때만 데모로 간주)
//  학생은 아무것도 입력하지 않는다. 접속 방식만으로 판별.
// ================================================================
const EXEC_STORE_KEY = 'malmoa:execUrl';
const APPBASE_STORE_KEY = 'malmoa:appBaseUrl';

function _readStoredExec(){
  try { return localStorage.getItem(EXEC_STORE_KEY) || ''; } catch(e){ return ''; }
}
function _writeStoredExec(url){
  try { localStorage.setItem(EXEC_STORE_KEY, url); } catch(e){}
}
function _readStoredAppBase(){
  try { return localStorage.getItem(APPBASE_STORE_KEY) || ''; } catch(e){ return ''; }
}
function _writeStoredAppBase(url){
  try { localStorage.setItem(APPBASE_STORE_KEY, url); } catch(e){}
}

const STUDENT_DEVICE_KEY = 'malmoa:studentDevice';
function _markStudentDevice(){
  try { localStorage.setItem(STUDENT_DEVICE_KEY, '1'); } catch(e){}
}
function _isStudentDevice(){
  try { return localStorage.getItem(STUDENT_DEVICE_KEY) === '1'; } catch(e){ return false; }
}
// 선생님이 본인 기기에서 연결할 때는 학생 표시를 해제한다.
function _clearStudentDevice(){
  try { localStorage.removeItem(STUDENT_DEVICE_KEY); } catch(e){}
}

function detectConnection(){
  // 저장된 앱 주소(학생 링크 베이스) 복원
  state.appBaseUrl = _readStoredAppBase();

  // ① 학생 링크: #c=<exec주소>
  let hash = '';
  try { hash = decodeURIComponent(location.hash || ''); } catch(e){ hash = location.hash || ''; }
  const m = hash.match(/[#&]c=([^&]+)/);
  if(m && m[1]){
    state.execUrl = m[1];
    state.isStudentLink = true;
    state.isDemo = false;
    _writeStoredExec(m[1]);   // 재접속 대비 저장
    _markStudentDevice();     // 이 기기는 학생용으로 표시
    return;
  }

  // ② 저장된 주소
  const stored = _readStoredExec();
  if(stored){
    state.execUrl = stored;
    // 학생 링크로 한 번이라도 들어온 기기라면, 주소창에 #c=가 없어도
    // 계속 학생 화면으로 취급한다. (선생님 설정가 학생에게 보이지 않도록)
    state.isStudentLink = _isStudentDevice();
    state.isDemo = false;
    return;
  }

  // ③ 둘 다 없음
  state.execUrl = null;
  state.isStudentLink = false;
  // google.script.run이 살아있으면(=GAS 직접 배포) 기존 연동 유지, 아니면 데모
  state.isDemo = !(typeof google!=='undefined' && google.script && google.script.run);
}

// ================================================================
//  서버 통신 — callServer(action, payload)
//  ① state.execUrl 있으면  fetch(exec)  [GitHub Pages 등 외부 배포]
//  ② 없고 google.script.run 가능하면 그걸로  [GAS 직접 배포 호환]
//  ③ 둘 다 없으면 데모(빈 결과)            [오프라인/체험]
//  CORS 우회: text/plain 으로 POST → doPost가 contents를 JSON 파싱
// ================================================================
// 연결된 시트로 요청 보내기
//  앱 화면과 시트는 서로 다른 주소라, 브라우저 보안에 막히지 않는 방식으로 부른다.
//  보낼 내용이 아주 길 때만 예전 방식(POST)으로 보낸다.
let _reqSeq = 0;
function requestSheet(baseUrl, action, payload){
  const body = JSON.stringify(payload || {});
  const query = 'action=' + encodeURIComponent(action) + '&payload=' + encodeURIComponent(body);

  if(query.length > 6000 && typeof fetch === 'function'){
    return fetch(baseUrl, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:action, payload:payload||{} })
    }).then(r=>r.json());
  }

  return new Promise((resolve, reject)=>{
    const cb = '_mm_' + Date.now() + '_' + (_reqSeq++);
    let done = false;
    const timer = setTimeout(()=>finish(null, true), 15000);

    function finish(res, failed){
      if(done) return;
      done = true;
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      const el = document.getElementById(cb);
      if(el && el.parentNode) el.parentNode.removeChild(el);
      if(failed) reject(new Error('연결에 실패했어요.'));
      else resolve(res);
    }

    window[cb] = (res)=>finish(res, false);

    const sc = document.createElement('script');
    sc.id = cb;
    sc.src = baseUrl + (baseUrl.indexOf('?')>=0 ? '&' : '?') + query +
             '&callback=' + encodeURIComponent(cb) + '&_=' + Date.now();
    sc.async = true;
    sc.onerror = ()=>finish(null, true);
    document.body.appendChild(sc);
  });
}

function callServer(action, payload){
  return new Promise((resolve)=>{
    const timer = setTimeout(()=>{ resolve({ _timeout:true }); }, 9000);

    // ① 연결된 시트로 요청
    if(state.execUrl){
      requestSheet(state.execUrl, action, payload||{})
        .then(d=>{ clearTimeout(timer); resolve(d||{}); })
        .catch(e=>{ clearTimeout(timer); console.warn('callServer:',action,e); resolve({ _error:true }); });
      return;
    }

    // ② google.script.run 폴백 (HTML이 GAS에 내장된 경우)
    if(typeof google!=='undefined' && google.script && google.script.run){
      const run = google.script.run
        .withSuccessHandler(r=>{ clearTimeout(timer); resolve(r||{}); })
        .withFailureHandler(e=>{ clearTimeout(timer); console.warn('callServer gsr:',action,e); resolve({ _error:true }); });
      switch(action){
        case 'findStudent':   run.findStudent(payload.num); break;
        case 'loadRecord':    run.loadRecord(payload.num); break;
        case 'saveRecord':    run.saveRecord(payload); break;
        case 'getGrowthData': run.getGrowthData(payload.num); break;
        case 'getDictPool':   run.getDictPool(); break;
        default: clearTimeout(timer); resolve({ ok:false, error:'unknown action' });
      }
      return;
    }

    // ③ 데모/오프라인
    clearTimeout(timer);
    resolve({ _demo:true });
  });
}

function _demoKey(num){ return 'progress:malmoa:' + num; }
function demoLoad(num){
  try{
    const raw = localStorage.getItem(_demoKey(num));
    if(!raw) return { found:false };
    const d = JSON.parse(raw);
    d.found = true;
    return d;
  }catch(e){ return { found:false }; }
}
function demoSave(num, rec){
  try{ localStorage.setItem(_demoKey(num), JSON.stringify(rec)); }catch(e){}
}
function demoClear(num){
  try{ localStorage.removeItem(_demoKey(num)); }catch(e){}
}

function gasFind(num){
  return callServer('findStudent', { num:num }).then(function(r){
    if(!r || r._timeout || r._error){
      setToast('\u26a0\ufe0f \ud559\ubc88 \uc870\ud68c \uc911 \uc624\ub958\uac00 \uc0dd\uacbc\uc5b4\uc694. \ub2e4\uc2dc \uc2dc\ub3c4\ud574\uc694.', 'warn', 3000);
      return { found:false };
    }
    if(r._demo) return { found:false, _demo:true };
    return r || { found:false };
  });
}
function gasLoad(num){
  // 데모 모드: localStorage에서 복원 (이어하기)
  if(state.isDemo){
    return Promise.resolve(demoLoad(num));
  }
  return callServer('loadRecord', { num:num }).then(function(r){
    if(!r || r._timeout || r._error){
      setToast('\u26a0\ufe0f \uae30\ub85d\uc744 \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc5b4\uc694. \uc0c8 \uae30\ub85d\uc73c\ub85c \uc2dc\uc791\ud574\uc694.', 'warn', 3000);
      return { found:false };
    }
    if(r._demo) return demoLoad(num); // 폴백이 데모를 반환한 경우도 로컬 복원
    return r || { found:false };
  });
}
function gasSave(){
  if(!state.studentNum) return;
  // 데모 모드: 시트에 저장하지 않고 localStorage에 저장
  if(state.isDemo){

let AC; try{ AC=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC={state:"closed",resume:()=>{},close:()=>{},createOscillator:()=>({start:()=>{},stop:()=>{},connect:()=>{},frequency:{value:0}}),createGain:()=>({gain:{value:0},connect:()=>{}}),destination:{},currentTime:0}; }
function playSound(type){
  // 소리는 부가 기능이므로, 소리를 낼 수 없는 환경에서도
  // 학습 흐름이 끊기지 않도록 오류를 삼킨다.
  try { _playSound(type); } catch(e) { /* 소리 없이 계속 진행 */ }
}
function _playSound(type){
  if(!AC) return;
  if(AC.state==='suspended') AC.resume();
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  const t=AC.currentTime;
  if(type==='correct'){ o.type='sine'; o.frequency.setValueAtTime(523.25,t); o.frequency.setValueAtTime(659.25,t+.1); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.01,t+.5); o.start(t); o.stop(t+.5); }
  else if(type==='wrong'){ o.type='sawtooth'; o.frequency.setValueAtTime(150,t); g.gain.setValueAtTime(.2,t); g.gain.linearRampToValueAtTime(.01,t+.3); o.start(t); o.stop(t+.3); }
  else{ o.type='triangle'; o.frequency.setValueAtTime(800,t); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+.1); o.start(t); o.stop(t+.1); }
}

// ================================================================
//  퀴즈 빌드
// ================================================================
function getDistractors(tw, tp, count, pool, rel, correctWord){
  const src = pool || getActivePool();
  const cw = correctWord || '';
  // 오답에서 제외할 단어들: 문제 단어(tw), 정답(cw)
  function notForbidden(w){
    if(!w) return false;
    if(w===tw) return false;
    if(w===cw) return false;
    return true;
  }
  // 후보 추출: 해당 rel의 모든 word/pair (단, tw·cw 제외)
  // include/included는 같은 rel만, 그 외는 pos 같은 것 우선
  const relFilter = (rel==='include'||rel==='included')
    ? function(d){ return d.rel===rel; }
    : function(d){ return d.pos===tp; };
  
  // 후보 단어 수집 (word와 pair 모두)
  const candSet = new Set();
  src.filter(relFilter).forEach(function(d){
    if(notForbidden(d.word)) candSet.add(d.word);
    if(notForbidden(d.pair)) candSet.add(d.pair);
  });
  
  let result = Array.from(candSet).sort(function(){return Math.random()-.5;}).slice(0,count);
  
  // 부족하면 pos 무관하게 보충 (단, rel만 맞거나 전체)
  if(result.length<count){
    const extraSet = new Set(result);
    src.forEach(function(d){
      if(extraSet.size >= count) return;
      if(notForbidden(d.word) && !extraSet.has(d.word)) extraSet.add(d.word);
      if(extraSet.size >= count) return;
      if(notForbidden(d.pair) && !extraSet.has(d.pair)) extraSet.add(d.pair);
    });
    result = Array.from(extraSet).sort(function(){return Math.random()-.5;}).slice(0,count);
  }
  
  // 최종 안전장치: tw, cw가 섞여 있으면 제거
  result = result.filter(function(w){ return w!==tw && w!==cw && w; });
  
  return result;
}
function buildQuizFromPool(dictPool, n){
  const qs=[],pool=[...dictPool];
  while(qs.length<n&&pool.length>0){
    const i=Math.floor(Math.random()*pool.length);
    const p=pool.splice(i,1)[0];
    let dist=getDistractors(p.word,p.pos,3,dictPool,p.rel,p.pair);
    if(dist.length<3) dist=dist.concat(getDistractors(p.word,undefined,3-dist.length,getActivePool(),p.rel,p.pair));
    // 최종 안전장치: dist에 p.word나 p.pair가 있으면 제거, 중복도 제거
    dist = Array.from(new Set(dist.filter(function(w){ return w && w!==p.word && w!==p.pair; })));
    // 3개가 안 되면 전체 풀에서 추가 보충
    if(dist.length<3){
      const seen = new Set([p.word, p.pair, ...dist]);
      const fallbackPool = getActivePool();
      for(let k=0; k<fallbackPool.length && dist.length<3; k++){
        const d=fallbackPool[k];
        if(!seen.has(d.word)){ dist.push(d.word); seen.add(d.word); }
        if(dist.length>=3) break;
        if(!seen.has(d.pair)){ dist.push(d.pair); seen.add(d.pair); }
      }
    }
    dist = dist.slice(0,3);
    qs.push({
      word:p.word, emoji:p.emoji||'📝', rel:p.rel, hint:p.hint, lv:p.lv,
      wordDef:p.wordDef, wordEasy:p.wordEasy||'', wordEx:p.wordEx||'',
      correct:p.pair, pairDef:p.pairDef, pairEasy:p.pairEasy||'', pairEx:p.pairEx||'',
      feedback:p.feedback||'',
      blankSent:p.blankSent||'', blankAns:p.blankAns||'', blankChoices:p.blankChoices||'',
      quizType:_pickQuizType(p),
      choices:[p.pair,...dist].sort(()=>Math.random()-.5)
    });
  }
  return qs;
}
function buildQuiz(n){
  return buildQuizFromPool(getActivePool(), n);
}

function fireConfetti(){
  const cv=document.getElementById('confetti-canvas');
  if(!cv) return;
  const ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const ps=[];
  for(let i=0;i<80;i++) ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20-5,color:`hsl(${Math.random()*120+60},100%,50%)`,life:120});
  (function up(){ ctx.clearRect(0,0,cv.width,cv.height); let a=false;
    ps.forEach(p=>{if(p.life>0){p.x+=p.vx;p.y+=p.vy;p.vy+=.5;p.life--;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,8,8);a=true;}});
    if(a) requestAnimationFrame(up); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

function setToast(txt,kind="hint",ms=2000){
  const t=id('toast'); t.className=`toast ${kind}`; t.innerHTML=txt; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',ms);
}

function openModal(title,body,actions){
  id('modalTitle').textContent=title; id('modalBody').innerHTML=body;
  const act=id('modalActions'); act.innerHTML='';
  // 낱말 의미 비교 팝업은 가로형
  const modal=document.querySelector('.modal');
  const isMeaning = body.includes('meaning-compare');
  if(modal){ modal.classList.toggle('wide-modal', isMeaning); }
  // actions: 배열({text,cls,fn}) 또는 HTML 문자열 모두 지원
  if(typeof actions === 'string'){ act.innerHTML=actions; }
  else { (actions||[]).forEach(a=>{ const b=document.createElement('button'); b.className=a.cls||'btn'; b.textContent=a.text; b.onclick=()=>{playSound('click');a.fn();}; act.appendChild(b); }); }
  id('backdrop').style.display='flex';
  // 의미 카드 모달: 피드백을 읽을 수 있도록 확인 버튼 3초 잠금
  if(isMeaning){ _lockConfirmBtn(3); }
}

// ── 확인 버튼 N초 잠금 (피드백 읽을 시간 확보) ─────────────
function _lockConfirmBtn(secs){
  const act = id('modalActions');
  const btn = act ? act.querySelector('button') : null;
  if(!btn) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '0.55';
  btn.style.cursor = 'wait';
  let remain = secs;
  btn.innerHTML = '⏳ '+remain+'초 후 다음 문제로';
  const iv = setInterval(function(){
    remain--;
    if(remain > 0){
      btn.innerHTML = '⏳ '+remain+'초 후 다음 문제로';
    } else {
      clearInterval(iv);
      btn.disabled = false;
      btn.style.opacity = '';
      btn.style.cursor = '';
      btn.innerHTML = original;
    }
  }, 1000);
}

function startTimer(){
  clearInterval(state.timerId);
  if(state.plan.timeMin<=0) return;
  state.startedAt=Date.now(); state.endsAt=state.startedAt+state.plan.timeMin*60000; state.timeUp=false;
  state.timerId=setInterval(()=>{
    const left=(state.endsAt-Date.now())/1000;
    const el=id('timerText'); if(el) el.textContent=fmtTime(left);
    if(left<=0&&!state.timeUp){
      state.timeUp=true; clearInterval(state.timerId); if(el) el.textContent='00:00';
      openModal('⏱️ 시간 종료!','<div style="text-align:center;">수사 시간이 끝났습니다!</div>',
        [{text:'결과 보기',cls:'btn primary',fn:()=>{ closeModal(); state.screen='result'; finishQuiz(); render(); }}]);
    }
  },250);
}

function render(){
  const root=id('root'); root.innerHTML='';
  if(state.screen==='intro') renderIntro(root);
  else if(state.screen==='login') renderLogin(root);
  else if(state.screen==='start') renderStart(root);
  else if(state.screen==='plan') renderPlan(root);
  else if(state.screen==='concept') renderConcept(root);
  else if(state.screen==='quiz') renderQuiz(root);
  else renderResult(root);
  updateTop();
}

      bg: 'linear-gradient(135deg,#fff8e1,#fffde7)',
      illust: '🔍',
      title: [state.studentName+' 탐정!', '임무를 알려줄게!'],
      body:  ['낱말 사이의 <mark style="background:#e3f2fd;padding:2px 6px;border-radius:4px;white-space:nowrap;">의미 관계</mark>를 파악하고 사건을 해결하세요!'],
      chips: ['≒ 비슷한 낱말','↔️ 반대인 낱말','⬇️ 뜻에 포함되는 낱말','⬆️ 뜻을 포함하는 낱말'],
      steps: null,
    },
    {
      bg: 'linear-gradient(135deg,#e3f2fd,#e8eaf6)',
      illust: '🚓',
      title: ['이렇게 수사해요!'],
      body: null, chips: null,
      steps: [
        {icon:'📚', text:'훈련소에서 의미 관계 개념 익히기'},
        {icon:'⚙️', text:'수사 난이도와 문제 수 설정'},
        {icon:'🎯', text:'여러 유형 퀴즈 풀고 🔍 단서·🏅 뱃지 수집'},
        {icon:'📒', text:'탐정수첩에서 수집한 단서·뱃지 확인'},
      ],
    },
  ];

  function renderSlide(){
    const s = slides[cur];
    const isLast = cur === slides.length-1;
    const dots = slides.map(function(_,i){
      return '<span style="display:inline-block;width:'+(i===cur?24:10)+'px;height:10px;border-radius:5px;background:'+(i===cur?'var(--primary-dark)':'#ccc')+';transition:all .3s;margin:0 3px;"></span>';
    }).join('');

    const titleHtml = s.title.join('<br>');
    const bodyHtml = s.body ? s.body.join('<br>') : '';

    const chipsHtml = s.chips
      ? '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;">'
        + s.chips.map(function(c){ return '<span class="intro-highlight">'+c+'</span>'; }).join('')
        + '</div>'
      : '';

    const stepsHtml = s.steps
      ? '<div style="display:flex;flex-direction:row;gap:clamp(16px,3vw,40px);align-items:center;width:100%;max-width:900px;margin-top:4px;">'
          /* 왼쪽: 아이콘(자동차) + 제목 */
        + '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;min-width:clamp(80px,14vw,140px);">'
        + '<span style="font-size:clamp(80px,14vw,160px);line-height:1;">'+s.illust+'</span>'
        + '<div style="font-size:clamp(22px,3.5vw,36px)!important;font-weight:bold;color:var(--primary-dark);text-align:center;margin-top:8px;">'+ s.title.join('<br>') +'</div>'
        + '</div>'
          /* 오른쪽: 단계 목록 */
        + '<div style="flex:1;display:flex;flex-direction:column;gap:clamp(8px,1.5vw,14px);text-align:left;">'
        + s.steps.map(function(st){
            return '<div style="display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:14px 18px;border:2px solid var(--line);">'
              + '<span style="font-size:clamp(28px,3.5vw,40px);flex-shrink:0;">'+st.icon+'</span>'
              + '<span style="font-size:clamp(18px,2.5vw,28px)!important;color:#1a2a1e;font-weight:bold;white-space:nowrap;">'+st.text+'</span>'
              + '</div>';
          }).join('')
        + '</div>'
        + '</div>'
      : '';

    root.innerHTML = '<div style="background:'+s.bg+';height:100%;display:flex;flex-direction:column;overflow:hidden;">'
      + '<div class="intro-slide" style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;">'
      + (s.steps ? '' : '<div class="intro-illust">'+s.illust+'</div>')
      + (s.steps ? '' : '<div class="intro-title">'+titleHtml+'</div>')
      + (bodyHtml && !s.steps ? '<div class="intro-body">'+bodyHtml+'</div>' : '')
      + chipsHtml
      + stepsHtml
      + '</div>'
      + '<div style="padding:clamp(8px,1.2vw,16px) var(--pad) 24px;flex-shrink:0;">'
      + '<div class="intro-dot-row">'+dots+'</div>'
      + '<div style="display:grid;grid-template-columns:'+(cur>0?'1fr ':'')+' 1fr;gap:10px;">'
      + (cur>0 ? '<button class="btn secondary" style="min-height:var(--btn-h);height:auto;padding:clamp(10px,1.5vw,16px);font-size:clamp(24px,2.5vw,28px)!important;" onclick="APP._introPrev()">← 이전</button>' : '')
      + (!isLast
          ? '<button class="btn cta big" style="width:100%;min-height:var(--btn-h);height:auto;padding:clamp(10px,1.5vw,16px);font-size:clamp(24px,2.5vw,28px)!important;" onclick="APP._introNext()">다음 →</button>'
          : '<button class="btn cta big" style="width:100%;min-height:var(--btn-h);height:auto;padding:clamp(10px,1.5vw,16px);font-size:clamp(22px,2.5vw,26px)!important;" onclick="APP._introDone()">🚓 수사 시작 준비 완료!</button>')
      + '</div>'
      + (cur===0 ? '<p style="text-align:center;font-size:clamp(23px,2vw,25px)!important;color:var(--muted);margin-top:10px;">건너뛰기: <button onclick="APP._introDone()" style="background:none;border:none;color:var(--muted);font-family:Jua,sans-serif;font-size:clamp(23px,2vw,25px)!important;cursor:pointer;text-decoration:underline;">바로 시작하기</button></p>' : '')
      + '</div>'
      + '</div>';
  }

  window.APP._introNext = function(){ if(cur<slides.length-1){ cur++; renderSlide(); } };
  window.APP._introPrev = function(){ if(cur>0){ cur--; renderSlide(); } };
  window.APP._introDone = function(){
    state.introDone=true;
    state.screen='start';
    gasSave();
    render();
  };

  renderSlide();
}

          <div style="font-size:52px;animation:bounce 2s infinite;margin-bottom:8px;">🦉</div>
          <h1 class="h1" style="margin:0 0 4px;">말모이 탐정 사무소 1</h1>
          <p style="font-size:clamp(17px,2.2vw,23px)!important;color:#e65100;margin:0 0 14px;line-height:1.5;">낱말의 의미 관계,<br>그 복잡한 관계를 찾아라!</p>
          <input class="login-input" id="nameInput" type="text" placeholder="이름 입력" maxlength="10"
            onkeydown="if(event.key==='Enter') APP.doLoginName()"/>
          <button class="btn cta big" style="width:100%;margin-top:12px;" onclick="APP.doLoginName()">🚀 수사 시작!</button>
          ${renderTeacherMenu()}

  // ── 2단계: 이름 확인 카드 ────────────────────────────────────

  // 4자리 입력 완료 시 즉시 활성화 (GAS 조회 전에도)

function renderConcept(root){
  const activePool = getActivePool();
  const pools={
    synonym:  activePool.filter(function(d){return d.rel==='synonym';}),
    antonym:  activePool.filter(function(d){return d.rel==='antonym';}),
    include:  activePool.filter(function(d){return d.rel==='include';}),
    included: activePool.filter(function(d){return d.rel==='included';}),
  };
  function pick(rel){ var p=pools[rel]; return p.length?p[Math.floor(Math.random()*p.length)]:null; }
  const wu={ syn:pick('synonym'), ant:pick('antonym'), inc:pick('include'), incl:pick('included') };

  function wuBtns(correct, excludeWord){
    const wrong=activePool
      .filter(function(d){return d.pair!==correct&&d.word!==correct&&d.pair!==excludeWord;})
      .sort(function(){return Math.random()-.5;}).slice(0,3).map(function(d){return d.pair;});
    return [correct].concat(wrong).sort(function(){return Math.random()-.5;})
      .map(function(w){ return '<button class="warmup-btn" onclick="APP.warmupCheck(this,\''+w+'\',\''+correct+'\')">'+ w +'</button>'; })
      .join('');
  }

  function wuBlock(item, wuid, color, icon, label){
    if(!item) return '<div style="text-align:center;color:#aaa;">문제를 불러오는 중...</div>';
    return '<div style="background:#fff;border-radius:20px;padding:24px 28px;border:3px solid '+color+';">'
      +'<div class="warmup-q" style="font-size:clamp(32px,4vw,44px)!important;color:#1a2a1e;font-weight:bold;margin-bottom:16px;text-align:center;">'
      +icon+' &ldquo;<b style="color:'+color+';">'+item.word+'</b>&rdquo;과(와) <b>'+label+'</b>은?'
      +'</div>'
      +'<div class="warmup-grid">'+wuBtns(item.pair, item.word)+'</div>'
      +'<div class="warmup-result" id="'+wuid+'" style="margin-top:12px;font-size:clamp(24px,3vw,32px)!important;text-align:center;font-weight:bold;"></div>'
      +'</div>';
  }

  const SLIDES = [
    { color:'#e8f5e9', border:'#1a5c1a', html: _html_slide1(wu) },
    { color:'#fff3e0', border:'#e65100', html: _html_slide2(wu) },
    { color:'#e3f2fd', border:'#1976d2', html: _html_slide3(wu) },
    { color:'#f3e5f5', border:'#8e24aa', html: _html_slide4(wu) },
    { color:'#f1f8e9', border:'#bf360c', html: wuBlock(wu.syn,'wu1','#bf360c','&#8786;','뜻이 비슷한 낱말') },
    { color:'#fff8f0', border:'#0d47a1', html: wuBlock(wu.ant,'wu2','#0d47a1','&#8596;','뜻이 반대인 낱말') },
    { color:'#e8f4fd', border:'#b71c1c', html: wuBlock(wu.inc,'wu3','#b71c1c','&#11015;','뜻에 포함되는 낱말') },
    { color:'#f9f0fd', border:'#1b5e20', html: wuBlock(wu.incl,'wu4','#1b5e20','&#11014;','뜻을 포함하는 낱말') },
  ];

  var cur=0;

  function mkDots(){
    return SLIDES.map(function(_,i){
      var w=i===cur?22:10, bg=i===cur?'var(--primary-dark)':'#ccc';
      return '<span style="display:inline-block;width:'+w+'px;height:10px;border-radius:5px;background:'+bg+';transition:all .3s;margin:0 3px;"></span>';
    }).join('');
  }

  function renderSlide(){
    var s=SLIDES[cur], isLast=(cur===SLIDES.length-1);
    id('conceptSlide').innerHTML='<div style="background:'+s.color+';border:2px solid '+s.border+';border-radius:14px;padding:10px 12px;animation:pop .25s ease;overflow-y:auto;">'+s.html+'</div>';
    id('conceptDots').innerHTML=mkDots();
    id('conceptBtns').innerHTML='<div style="display:grid;grid-template-columns:'+(cur>0?'1fr ':'')+' 1fr;gap:10px;">'
      +(cur>0?'<button class="btn secondary" style="height:var(--btn-h);font-size:clamp(25px,2vw,27px)!important;" onclick="APP._slidePrev()">&#8592; 이전</button>':'')
      +(isLast?'<button class="btn cta" style="height:var(--btn-h);font-size:clamp(25px,2vw,27px)!important;" onclick="APP.goStart()">&#10003; 개념 확인 완료!</button>'
              :'<button class="btn cta" style="height:var(--btn-h);font-size:clamp(25px,2vw,27px)!important;" onclick="APP._slideNext()">다음 &#8594;</button>')
      +'</div>';
  }

  window.APP._slideNext=function(){ if(cur<SLIDES.length-1){ cur++; renderSlide(); } };
  window.APP._slidePrev=function(){ if(cur>0){ cur--; renderSlide(); } };

  root.innerHTML='<div class="card" style="padding:var(--pad);display:flex;flex-direction:column;gap:4px;overflow:hidden;height:100%;">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">'

// 유형 가중치: choice 40%, blank 20%, card 20%, sort 20%
function _pickQuizType(entry){
  // include/included는 4지선다만 (분류하기·빈칸이 맞지 않음)
  if(entry.rel==='include'||entry.rel==='included') return 'choice';
  if(!entry.wordEx) return 'choice'; // 예문 없으면 4지선다

  // ── A안: 단계별 문제 구성 (사건 번호 기준) ──────────────────
  //  사건 1·2 → 단어 중심 (4지선다)
  //  사건 3·4 → 맥락 중심 (빈칸 70% + 짝맞추기 30%)
  const caseNum = state.missionCase || 0;
  if(caseNum === 1 || caseNum === 2){
    return 'choice';  // 단어 중심: 의미 관계 파악
  }
  if(caseNum === 3 || caseNum === 4){
    return Math.random() < 0.7 ? 'blank' : 'card';  // 맥락 중심
  }
  // 사건 정보 없을 때(복습 등) → 기존 혼합 비율
  const r = Math.random();
  if(r < 0.50) return 'choice';
  if(r < 0.80) return 'blank';
  return 'card';
}

function renderBlank(root, q){
  // include/included는 4지선다로 fallback
  if(q.rel==='include'||q.rel==='included'){ renderChoice(root,q); return; }
  const rel = q.rel||'synonym';

  // ── 빈칸 문장 결정 (우선순위) ─────────────────────────────
  //  1순위: 문제은행 빈칸_문장(blankSent) — 교사가 검수한 맥락
  //  2순위: 예문(wordEx)에서 자동 빈칸 생성
  //  실패: 4지선다로 폴백
  let sentence = null;
  if(q.blankSent && q.blankSent.indexOf('___')!==-1){
    sentence = q.blankSent.replace('___', '<span class="blank-word">___</span>');
  } else {
    sentence = _makeBlank(q.wordEx||'', q.word);
  }
  if(!sentence){ renderChoice(root,q); return; }

  // ── 보기 결정 ─────────────────────────────────────────────
  //  blankAns + blankChoices(활용형 오답)가 있으면 → 활용형으로 통일된 4지선다
  //  없으면 → 기존 q.choices(기본형) 사용, 정답은 q.correct
  let choices, correctAns;
  if(q.blankAns && q.blankChoices){
    const distractors = q.blankChoices.split(',').map(function(s){return s.trim();}).filter(Boolean);
    choices = [q.blankAns].concat(distractors);
    // 셔플
    for(let i=choices.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [choices[i],choices[j]]=[choices[j],choices[i]]; }
    correctAns = q.blankAns;
  } else {
    choices = q.choices;
    correctAns = q.correct;
  }
  // 빈칸 정답 판정 기준을 현재 문제에 임시 저장 (checkAnswer에서 사용)
  q._blankCorrect = correctAns;

  const blankGuide = {
    synonym:  `<b style="color:var(--primary-dark);">"${q.word}"</b>과(와) 뜻이 비슷한 낱말을 빈칸에 넣어보세요!`,
    antonym:  `<b style="color:#e65100;">"${q.word}"</b>의 뜻이 반대인 낱말을 빈칸에 넣어보세요!`,
    include:  `<b style="color:#0d47a1;">"${q.word}"</b>의 뜻에 포함되는 낱말을 빈칸에 넣어보세요!`,
    included: `<b style="color:#1b5e20;">"${q.word}"</b>의 뜻을 포함하는 낱말을 빈칸에 넣어보세요!`,
  };
  root.innerHTML=`
    <div class="card">
      ${_quizHeader(q)}
      <span class="quiz-type-badge">✏️ 빈칸 채우기</span>
      <p style="font-size:clamp(27px,2.5vw,30px)!important;color:var(--muted);margin:6px 0 4px;">
        ${blankGuide[rel]||blankGuide.synonym}
      </p>
      <div class="blank-sentence">${sentence}</div>
      <div class="choiceGrid4">
        ${choices.map(c=>`<button class="choiceBtn locked" disabled onclick="APP.checkAnswer(this,'${c}')">${c}</button>`).join('')}
      </div>
      <div class="lock-indicator" id="lockMsg">⏳ 문장을 읽어보세요 (2초)</div>
      <div id="feedbackBox" class="feedback-box"></div>
      <div id="nextBtnWrap" style="display:none;"></div>
    </div>`;
  _startQuizLock();
}

// ── 예문에서 단어(활용형 포함)를 빈칸으로 교체 ─────────────
// 성공 시 빈칸 HTML 포함 문장 반환, 실패 시 null
function _makeBlank(sentence, word){
  if(!sentence || !word) return null;
  const BLANK = '<span class="blank-word">___</span>';
  // 1) 원형 그대로 매칭
  if(sentence.indexOf(word) !== -1){
    return sentence.replace(word, BLANK);
  }
  // 2) 동사·형용사 활용형: 어간 기준 어절 매칭
  let stem = word;
  if(word.length >= 2 && word.endsWith('다')) stem = word.slice(0, -1); // 어간 (훌륭하다→훌륭하)
  const tokens = sentence.split(' ');
  for(let cut = 0; cut < stem.length; cut++){
    const probe = stem.slice(0, stem.length - cut);
    if(probe.length < 2) break; // 최소 2글자 어간만 신뢰
    for(let i = 0; i < tokens.length; i++){
      const m = tokens[i].match(/^[가-힣]+/);
      if(m && m[0].startsWith(probe) && m[0].length > probe.length - 1){
        const trail = tokens[i].slice(m[0].length); // 뒤 구두점 유지
        tokens[i] = BLANK + trail;
        return tokens.join(' ');
      }
    }
  }
  // 3) 못 찾음 → null (호출부에서 4지선다 폴백)
  return null;
}

  const cards = [...q.choices].sort(()=>Math.random()-.5);

    <div class="card">
      ${_quizHeader(q)}
      <span class="quiz-type-badge">🃏 짝 맞추기</span>

      <div id="feedbackBox" class="feedback-box"></div>

function cardTap(btn, choice){
  if(state.solved) return;
  const q = state.currentQ;
  if(choice === q.correct){
    btn.classList.add('correct-card');
    document.querySelectorAll('.match-card').forEach(b=>{ b.disabled=true; });
    resolveAnswer(true, btn);
  } else {
    btn.classList.add('wrong-card');
    setTimeout(()=>btn.classList.remove('wrong-card'), 600);
    resolveAnswer(false, btn);
  }
}

function sortSelect(btn, word){
  if(state.solved) return;
  if(btn.classList.contains('placed')) return;
  // 선택 토글
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('selected-sort'));
  if(state._sortSelected===word){
    state._sortSelected=null;
    return;
  }
  state._sortSelected=word;
  btn.classList.add('selected-sort');
}

function sortDrop(zone){
  if(state.solved||!state._sortSelected) return;
  const word=state._sortSelected;
  const q=state.currentQ;
  const btn=id('sortbtn-'+word);
  // 핵심 체크: 사용자가 correct 단어를 올바른 zone에 넣었는지
  const relKey = {synonym:'syn',antonym:'ant',include:'inc',included:'incl'}[q.rel]||'syn';

  if(btn) { btn.classList.add('placed'); btn.classList.remove('selected-sort'); }

  // zone에 chip 추가
  const zone_el = id('zone-'+zone);
  if(zone_el){
    const chip=document.createElement('div');
    chip.className='sort-word-chip';
    chip.textContent=word;
    zone_el.appendChild(chip);
  }

  state._sortSelected=null;
  state._sortPlaced[word]=zone;

  // correct 단어가 배치됐으면 정답 체크
  if(state._sortPlaced[q.correct]!==undefined){
    const isOk = state._sortPlaced[q.correct]===relKey;
    // 모든 버튼 비활성화
    document.querySelectorAll('.sort-btn').forEach(b=>b.disabled=true);
    resolveAnswer(isOk, zone_el);
  }
}

function finishQuiz(){
  state.totalQuizzes++;
  const score=Math.round(state.correct/state.questions.length*100);
  if(score===100) state.hadPerfect=true;
  if(!state.proactiveHintUsed) state.hadNoHintClear=true;
  if(state.questions.length>=10){
    if(score===100) state.hadPerfect10=true;
    if(!state.proactiveHintUsed) state.hadNoHintClear10=true;
  }

  // ── 미션 완료 처리 (70% 이상이면 수사 성공) ──
  if(score>=70 && state.missionRel && state.missionCase){
    const rk = state.missionRel;
    const prefix = rk==='included'?'incl':rk==='include'?'inc':rk;
    const mId = prefix+'_'+state.missionCase;
    if(!state.completedMissions.includes(mId)){
      state.completedMissions.push(mId);
      state.newBadges.push(mId);
      // 뱃지 획득 팝업
      const caseN=state.missionCase;
      const bnames=['','나무 뱃지','동 뱃지','은 뱃지','금 뱃지'];
      const bname=bnames[caseN]||'수사 뱃지';
      const relIconMap={synonym:'≒',antonym:'↔',include:'⬇',included:'⬆'};
      const relColorMap={synonym:'#2e7d32',antonym:'#bf360c',include:'#0d47a1',included:'#4a148c'};
      const relLabelMap={synonym:'뜻이 비슷한 낱말',antonym:'뜻이 반대인 낱말',include:'뜻에 포함되는 낱말',included:'뜻을 포함하는 낱말'};
      const rSym = relIconMap[rk]||'';
      const rColor = relColorMap[rk]||'#333';
      const rLabel = relLabelMap[rk]||'';
      setTimeout(function(){
        openModal('🏅 뱃지 획득!',
          '<div style="text-align:center;padding:16px 0;">'
          +'<div style="display:flex;justify-content:center;margin-bottom:6px;">'+badgeSvgGlobal(caseN,true,rSym,rColor)+'</div>'
          +'<div style="font-size:clamp(22px,3vw,30px)!important;font-weight:bold;color:'+rColor+';margin-bottom:4px;">'+rSym+' '+bname+'</div>'
          +'<div style="font-size:clamp(14px,2vw,18px)!important;color:#555;">'+rLabel+' · 사건 '+caseN+' 수사 성공! 🎉</div>'
          +'</div>',
          '<button class="btn cta" style="width:100%;min-height:var(--btn-h);font-size:clamp(18px,2.5vw,24px)!important;" onclick="APP.closeModal();">확인!</button>'
        );
      }, 600);
    }
  }
  checkBadges();

  // 뜻이 비슷한 낱말/뜻이 반대인 낱말 분리 정답률 계산
  const synQs  =state.questions.filter(q=>q.rel==='synonym');
  const antQs  =state.questions.filter(q=>q.rel==='antonym');
  const incQs  =state.questions.filter(q=>q.rel==='include');
  const inclQs =state.questions.filter(q=>q.rel==='included');
  const wrongWords=state.wrongWords;
  const synWrong =wrongWords.filter(w=>w.rel==='synonym').map(w=>w.word);
  const antWrong =wrongWords.filter(w=>w.rel==='antonym').map(w=>w.word);
  const incWrong =wrongWords.filter(w=>w.rel==='include').map(w=>w.word);
  const inclWrong=wrongWords.filter(w=>w.rel==='included').map(w=>w.word);
  const synCorrect =synQs.length-synWrong.length;
  const antCorrect =antQs.length-antWrong.length;
  const incCorrect =incQs.length-incWrong.length;
  const inclCorrect=inclQs.length-inclWrong.length;

  // wrongHistory 업데이트
  state.wrongWords.forEach(w=>{
    state.wrongHistory[w.word]=(state.wrongHistory[w.word]||0)+1;
  });
  // 세션 데이터 저장
  state.lastSession={
    score, correct:state.correct, total:state.questions.length,
    synCorrect, synTotal:synQs.length,
    antCorrect, antTotal:antQs.length,
    incCorrect, incTotal:incQs.length,
    inclCorrect, inclTotal:inclQs.length,
    hintUsed:state.hintUsedCount,
    difficulty:state.difficulty,
    duration:Math.round((Date.now()-(state.quizStartTime||Date.now()))/1000),
    wrongWords:state.wrongWords
  };
  gasSave();

  // 데모 모드: 미션 16개를 모두 완료(전설)하면 이 학생의 로컬 저장을 리셋
  if(state.isDemo && (state.completedMissions||[]).length >= 16){
    demoClear(state.studentNum);
  }
}

async function showGrowth(){

  bd.style.display='flex';

  // 서버에서 데이터 로드 (callServer: exec → gsr → 데모)
  let data = await callServer('getGrowthData', { num: state.studentNum });
  if(data && (data._demo || data._timeout || data._error)) data = null;
  if(!data){
    // 오프라인/데모 — 현재 세션 데이터로 시뮬레이션
    data = {
      history: state.lastSession ? [{

        synRate:state.lastSession.synTotal>0?Math.round(state.lastSession.synCorrect/state.lastSession.synTotal*100):0,
        antRate:state.lastSession.antTotal>0?Math.round(state.lastSession.antCorrect/state.lastSession.antTotal*100):0,

      myXP: state.xp,
      myQuizzes: state.totalQuizzes,
      myAnswered: state.totalAnswered,
      myMaxCombo: state.maxComboEver,
      classAvgScore: null,

            <span>${classAvg}%</span>
          </div>

    </div>` : '';

  mdl.innerHTML=`

    <div class="body">
      <!-- 핵심 통계 -->

// ── 설명 핵심어 강조 (가독성) ──────────────────────────────
function _highlightKeywords(text, q, relInfo){
  if(!text) return '';
  let out = text;
  const color = relInfo.color, chip = relInfo.chip;
  // 1) 두 핵심 낱말 강조 (색상 칩)
  [q.word, q.correct].forEach(function(w){
    if(!w) return;
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out = out.replace(new RegExp("'"+esc+"'",'g'),
      "<b style=\"color:"+color+";background:"+chip+";padding:1px 7px;border-radius:6px;\">'"+w+"'</b>");
  });
  // 2) 관계 핵심어 강조 (색상 볼드)
  ['유의어','비슷한','반의어','정반대','반대','포함하는','포함되는','큰 범주','한 종류','세트로'].forEach(function(t){
    out = out.replace(new RegExp('('+t+')','g'),
      '<b style="color:'+color+';">$1</b>');
  });
  return out;
}

// ── 워밍업 정답 확인 ─────────────────────────────────────────
function warmupCheck(btn, choice, correct){
  // choice: 탭한 버튼의 낱말, correct: 정답 낱말
  const isOk = String(choice) === String(correct);
  playSound(isOk ? 'correct' : 'wrong');
  // 컨테이너 탐색 — warmup-grid 부모
  const grid = btn.closest('.warmup-grid');
  const card = grid ? grid.parentElement : btn.parentElement.parentElement;
  const btns = card ? card.querySelectorAll('.warmup-btn') : [];
  btns.forEach(b => { b.disabled = true; });
  if(isOk){
    btn.classList.add('w-correct');
    const res = card ? card.querySelector('.warmup-result') : null;
    if(res){ res.style.color='var(--sage)'; res.textContent='✅ 정답! 정말 잘했어요!'; }
  } else {
    btn.classList.add('w-wrong');
    btns.forEach(b => { if(b.textContent.trim()===String(correct)) b.classList.add('w-correct'); });
    const res = card ? card.querySelector('.warmup-result') : null;
    if(res){ res.style.color='var(--danger)'; res.textContent='❌ 정답은 "'+correct+'"예요!'; }
  }
}

function getStrategyTip(word, correct, rel) {
  // 단어쌍별 실제 문장 예시 데이터
  const SWAP_EXAMPLES = {

function connectExec(){

  if(!/\/exec\b/.test(exec)){ setToast('주소가 .../exec 형식인지 확인해주세요.','warn'); return; }

  setToast('주소를 확인하고 있어요...','good',1500);
  // 먼저 연결되는 주소인지 확인하고, 될 때만 저장한다.

function copyStudentLink(){

  const doToast = ()=> setToast('학생용 주소를 복사했어요!','good',1500);

// 숫자 패드 입력
async function numpadTap(k){
  playSound('click');
  if(k==='⌫'){
    state.loginDigits=state.loginDigits.slice(0,-1);
    state.loginResult=null; state.loginSearching=false;
    render(); return;
  }
  if(k==='✓'){
    // 이미 found 상태면 바로 확인 단계로
    if(state.loginResult&&state.loginResult.found){
      state.loginStep='confirm'; render(); return;
    }
    // 4자리인데 아직 조회 전이면 조회 후 확인 단계로
    if(state.loginDigits.length===4){
      state.loginSearching=true; render();
      const res=await gasFind(state.loginDigits);
      state.loginSearching=false;
      state.loginResult=res||{found:false};
      if(res&&res.found){ state.loginStep='confirm'; }
      render();
    }
    return;
  }
  if(state.loginDigits.length>=4) return;
  state.loginDigits+=String(k);
  state.loginResult=null;
  if(state.loginDigits.length===4){
    // 4자리 완성 → GAS 조회
    state.loginSearching=true; render();
    const res=await gasFind(state.loginDigits);
    state.loginSearching=false;
    state.loginResult=res||{found:false};
    // 찾으면 바로 이름 확인 단계로
    if(res && res.found){
      state.loginStep='confirm';
    }
    render();
  } else {
    render();
  }
}

// 오답 단어만 골라 다시 풀기
function retryWrong(){
  if(!state.wrongWords || state.wrongWords.length===0) return;
  playSound('click');

  // 오답 단어 풀로 퀴즈 재구성
  const activePool = getActivePool();
  const wrongPool = state.wrongWords.map(w=>{
    // 문제은행(또는 DICT_POOL)에서 해당 단어 찾기
    const entry = activePool.find(d=>d.word===w.word);
    if(!entry) return null;
    let dist = getDistractors(entry.word, entry.pos, 3, activePool);
    if(dist.length<3) dist=dist.concat(getDistractors(entry.word,undefined,3-dist.length,activePool));
    return {
      word:entry.word, emoji:entry.emoji||'📝', wordDef:entry.wordDef, wordEasy:entry.wordEasy||'',
      correct:entry.pair, pairDef:entry.pairDef, pairEasy:entry.pairEasy||'',
      rel:entry.rel, hint:entry.hint, lv:entry.lv,
      emoji:entry.emoji||'📝',
      wordEasy:entry.wordEasy||'', pairEasy:entry.pairEasy||'',
      wordEx:entry.wordEx||'', pairEx:entry.pairEx||'',
      feedback:entry.feedback||'',
      blankSent:entry.blankSent||'', blankAns:entry.blankAns||'', blankChoices:entry.blankChoices||'',
      choices:[entry.pair,...dist].sort(()=>Math.random()-.5),
      quizType:_pickQuizType(entry)
    };
  }).filter(Boolean);

  if(wrongPool.length===0){ setToast('🔍 다시 풀 문제를 찾지 못했어요.','warn'); return; }

  // 퀴즈 상태 초기화 (오답 단어만)
  state.questions = wrongPool;
  state.idx=0; state.correct=0; state.combo=0; state.maxCombo=0;
  state.clues=0; state.newBadges=[]; state.wrongWords=[];
  state.proactiveHintUsed=false; state.hintUsedCount=0;
  state.quizStartTime=Date.now(); state.lastSession=null;
  state.screen='quiz';
  clearInterval(state.timerId); // 시간 제한 없음 (복습이므로)
  setToast(`🔄 틀린 단어 ${wrongPool.length}개를 다시 풀어요!`,'good',2000);
  render();
}
